<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Captured // Spy Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050000;
            color: #ff3333; /* নিওন রেড এলার্ট ভাইব */
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড ম্যাট্রিক্স রেইন */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .spy-box {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            background: rgba(15, 0, 0, 0.9);
            border: 2px solid #ff3333;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.3);
            padding: 35px;
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
        }

        .spy-header {
            color: #fff;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px #ff3333;
            border-bottom: 1px dashed #ff3333;
            padding-bottom: 15px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .data-line {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.6;
            display: flex;
            flex-wrap: wrap;
        }

        .label {
            color: #ffaa33;
            width: 160px;
            display: inline-block;
        }

        .value {
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .btn-back {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 20px;
            border: 1px solid #ff3333;
            background: transparent;
            color: #ff3333;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 15px #ff3333;
        }
    </style>
</head>
<body>

    <!-- ম্যাট্রিক্স রেইন ব্যাকগ্রাউন্ড -->
    <canvas id="matrix"></canvas>

    <div class="spy-box">
        <!-- আপডেট করা হেডার টেক্সট -->
        <div class="spy-header">[ ALERT: HERE YOU ARE ]</div>
        
        <div id="loading-text" style="font-size: 18px; text-align: center; color: #ffaa33;">
            PINGING TARGET BACKDOOR... <span class="blink">|</span>
        </div>

        <div id="target-data" style="display: none;">
            <div class="data-line"><span class="label">> Name:</span><span class="value" id="val-name">System Visitor</span></div>
            <div class="data-line"><span class="label">> IP Address:</span><span class="value" id="val-ip">Fetching...</span></div>
            <div class="data-line"><span class="label">> Device Name:</span><span class="value" id="val-device">Detecting...</span></div>
            <div class="data-line"><span class="label">> Location:</span><span class="value" id="val-loc">Locating...</span></div>
        </div>

        <div style="text-align: right;">
            <a href="hacking-profile.html" class="btn-back">< RETURN TO TERMINAL</a>
        </div>
    </div>

    <script>
        // ব্যাকগ্রাউন্ড রেগুলার ম্যাট্রিক্স রেইন স্কিপ্ট
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%-+=*";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff3333';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() * 0.975 > 0.95) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // ডিভাইস নেম ডিটেক্ট করা 
        function getDeviceName() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android Device";
            if (/iPhone|iPad|iPod/i.test(ua)) return "iOS Device (iPhone/iPad)";
            if (/Windows/i.test(ua)) return "Windows PC";
            if (/Mac/i.test(ua)) return "Macintosh PC";
            if (/Linux/i.test(ua)) return "Linux Workstation";
            return "Unknown Secure Node";
        }

        // এনিমেশন এবং লাইভ ডেটা লোড
        setTimeout(async () => {
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('target-data').style.display = 'block';
            
            // ডিভাইস সেটআপ
            document.getElementById('val-device').innerText = getDeviceName();

            try {
                // লাইভ আইপি এবং লোকেশন ফেচ করার রিয়েল ফ্রি এপিআই
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if(data.ip) {
                    document.getElementById('val-ip').innerText = data.ip;
                    document.getElementById('val-loc').innerText = `${data.city}, ${data.region}, ${data.country_name}`;
                } else {
                    throw new Error();
                }
            } catch (error) {
                // অফলাইন বা ব্লকড থাকলে ডামি সিকিউর ডেটা শো করবে
                document.getElementById('val-ip').innerText = "192.168." + Math.floor(Math.random() * 255) + "." + Math.floor(Math.random() * 255);
                document.getElementById('val-loc').innerText = "Encrypted Proxy, Dhaka, BD";
            }
        }, 1800);
    </script>
</body>
</html>
